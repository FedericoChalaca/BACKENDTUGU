# CI del backend TUGU: compila y corre TODOS los tests (unitarios + integración
# contra un PostgreSQL efímero) en cada push y pull request.
#
# Alcance deliberado (prototipo): solo build + tests. El deploy a DEV/STAGING
# con CDK llega cuando exista la infraestructura AWS (tarjeta [P0][AWS]).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tugu
          POSTGRES_USER: tugu
          POSTGRES_PASSWORD: tugu_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tugu -d tugu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tugu.sln

      - name: Build
        run: dotnet build Tugu.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Tugu.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
