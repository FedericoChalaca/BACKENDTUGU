services:
  postgres:
    image: postgres:16-alpine
    container_name: tugu-postgres
    environment:
      POSTGRES_DB: tugu
      POSTGRES_USER: tugu
      # Credenciales SOLO de desarrollo local. Las reales vivirán en AWS.
      POSTGRES_PASSWORD: tugu_dev
    ports:
      - "5432:5432"
    volumes:
      - tugu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tugu -d tugu"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Visor web de la base de datos (solo desarrollo): http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: tugu-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  tugu-pgdata:
